# Input Types
input CreateCompanyInput {
    name: String! @rules(apply: ["required", "max:255"])
    code: String! @rules(apply: ["required", "max:50", "unique:companies,code"])
    email: String @rules(apply: ["email"])
    phone: String
    website: String
    is_active: Boolean
}

input UpdateCompanyInput {
    name: String @rules(apply: ["max:255"])
    email: String @rules(apply: ["email"])
    phone: String
    website: String
    is_active: Boolean
}

input CreateLeadInput {
    company_id: ID!
    name: String! @rules(apply: ["required", "max:255"])
    email: String @rules(apply: ["email"])
    phone: String
    company_name: String
    source: String
    status: String! @rules(apply: ["required"])
}

input UpdateLeadInput {
    name: String @rules(apply: ["max:255"])
    email: String @rules(apply: ["email"])
    phone: String
    status: String
    description: String
}

input CreateCustomerInput {
    company_id: ID!
    name: String! @rules(apply: ["required", "max:255"])
    email: String @rules(apply: ["email"])
    phone: String
    customer_type: String! @rules(apply: ["required"])
}

input UpdateCustomerInput {
    name: String @rules(apply: ["max:255"])
    email: String @rules(apply: ["email"])
    phone: String
    is_active: Boolean
}

input CreateQuoteInput {
    company_id: ID!
    customer_id: ID!
    quote_number: String! @rules(apply: ["required", "unique:quotes,quote_number"])
    quote_date: Date!
    subtotal: Float!
    total_amount: Float!
    status: String!
}

input UpdateQuoteInput {
    subtotal: Float
    total_amount: Float
    status: String
}

input CreateProductInput {
    company_id: ID!
    category_id: ID
    name: String! @rules(apply: ["required", "max:255"])
    code: String! @rules(apply: ["required", "max:50"])
    product_type: String! @rules(apply: ["required"])
    sale_price: Float
    purchase_price: Float
}

input UpdateProductInput {
    name: String @rules(apply: ["max:255"])
    sale_price: Float
    purchase_price: Float
    is_active: Boolean
}

input CreatePosOrderInput {
    company_id: ID!
    pos_session_id: ID!
    order_number: String! @rules(apply: ["required", "unique:pos_orders,order_number"])
    order_date: DateTime!
    subtotal: Float!
    total_amount: Float!
}

input UpdatePosOrderInput {
    subtotal: Float
    total_amount: Float
