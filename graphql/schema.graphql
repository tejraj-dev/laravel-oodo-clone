type Query {
    # User queries
    me: User @auth

    user(id: ID @eq): User @find @guard

    users(
        name: String @where(operator: "like")
        email: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 15) @guard
}

type Mutation {
    # Auth mutations
    login(email: String!, password: String!): AuthPayload @field(resolver: "App\\GraphQL\\Mutations\\Login")
    logout: LogoutResponse @field(resolver: "App\\GraphQL\\Mutations\\Logout") @guard
}

type User {
    id: ID!
    name: String!
    email: String!
    company_id: ID
    company: Company @belongsTo
    is_active: Boolean!
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
}

type AuthPayload {
    access_token: String!
    token_type: String!
    user: User!
}

type LogoutResponse {
    message: String!
}
