type Query {
    # User queries
    me: User @auth

    user(id: ID @eq): User @find @guard

    users(
        name: String @where(operator: "like")
        email: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 15) @guard

    # Core module
    companies: [Company!]! @paginate(defaultCount: 15) @guard
    company(id: ID! @eq): Company @find @guard

    currencies: [Currency!]! @paginate(defaultCount: 15) @guard
    currency(id: ID! @eq): Currency @find @guard

    # CRM module
    leads: [Lead!]! @paginate(defaultCount: 15) @guard
    lead(id: ID! @eq): Lead @find @guard

    opportunities: [Opportunity!]! @paginate(defaultCount: 15) @guard
    opportunity(id: ID! @eq): Opportunity @find @guard

    contacts: [Contact!]! @paginate(defaultCount: 15) @guard
    contact(id: ID! @eq): Contact @find @guard

    accounts: [Account!]! @paginate(defaultCount: 15) @guard
    account(id: ID! @eq): Account @find @guard

    # Sales module
    customers: [Customer!]! @paginate(defaultCount: 15) @guard
    customer(id: ID! @eq): Customer @find @guard

    quotes: [Quote!]! @paginate(defaultCount: 15) @guard
    quote(id: ID! @eq): Quote @find @guard

    salesOrders: [SalesOrder!]! @paginate(defaultCount: 15) @guard
    salesOrder(id: ID! @eq): SalesOrder @find @guard

    invoices: [Invoice!]! @paginate(defaultCount: 15) @guard
    invoice(id: ID! @eq): Invoice @find @guard

    # Purchase module
    vendors: [Vendor!]! @paginate(defaultCount: 15) @guard
    vendor(id: ID! @eq): Vendor @find @guard

    purchaseOrders: [PurchaseOrder!]! @paginate(defaultCount: 15) @guard
    purchaseOrder(id: ID! @eq): PurchaseOrder @find @guard

    bills: [Bill!]! @paginate(defaultCount: 15) @guard
    bill(id: ID! @eq): Bill @find @guard

    # Inventory module
    products: [Product!]! @paginate(defaultCount: 15) @guard
    product(id: ID! @eq): Product @find @guard

    productCategories: [ProductCategory!]! @paginate(defaultCount: 15) @guard
    productCategory(id: ID! @eq): ProductCategory @find @guard

    warehouses: [Warehouse!]! @paginate(defaultCount: 15) @guard
    warehouse(id: ID! @eq): Warehouse @find @guard

    # HR module
    employees: [Employee!]! @paginate(defaultCount: 15) @guard
    employee(id: ID! @eq): Employee @find @guard

    departments: [Department!]! @paginate(defaultCount: 15) @guard
    department(id: ID! @eq): Department @find @guard

    # Projects module
    projects: [Project!]! @paginate(defaultCount: 15) @guard
    project(id: ID! @eq): Project @find @guard

    tasks: [Task!]! @paginate(defaultCount: 15) @guard
    task(id: ID! @eq): Task @find @guard

    # POS module
    cashRegisters: [CashRegister!]! @paginate(defaultCount: 15) @guard
    cashRegister(id: ID! @eq): CashRegister @find @guard

    posSessions: [PosSession!]! @paginate(defaultCount: 15) @guard
    posSession(id: ID! @eq): PosSession @find @guard

    posOrders: [PosOrder!]! @paginate(defaultCount: 15) @guard
    posOrder(id: ID! @eq): PosOrder @find @guard
}

type Mutation {
    # Auth mutations
    login(email: String!, password: String!): AuthPayload @field(resolver: "App\\GraphQL\\Mutations\\Login")
    logout: LogoutResponse @field(resolver: "App\\GraphQL\\Mutations\\Logout") @guard

    # Core module
    createCompany(input: CreateCompanyInput! @spread): Company! @create @guard
    updateCompany(id: ID!, input: UpdateCompanyInput! @spread): Company! @update @guard
    deleteCompany(id: ID!): Company @delete @guard

    # CRM module
    createLead(input: CreateLeadInput! @spread): Lead! @create @guard
    updateLead(id: ID!, input: UpdateLeadInput! @spread): Lead! @update @guard
    deleteLead(id: ID!): Lead @delete @guard

    # Sales module
    createCustomer(input: CreateCustomerInput! @spread): Customer! @create @guard
    updateCustomer(id: ID!, input: UpdateCustomerInput! @spread): Customer! @update @guard
    deleteCustomer(id: ID!): Customer @delete @guard

    createQuote(input: CreateQuoteInput! @spread): Quote! @create @guard
    updateQuote(id: ID!, input: UpdateQuoteInput! @spread): Quote! @update @guard
    deleteQuote(id: ID!): Quote @delete @guard

    # Inventory module
    createProduct(input: CreateProductInput! @spread): Product! @create @guard
    updateProduct(id: ID!, input: UpdateProductInput! @spread): Product! @update @guard
    deleteProduct(id: ID!): Product @delete @guard

    # POS module
    createPosOrder(input: CreatePosOrderInput! @spread): PosOrder! @create @guard
    updatePosOrder(id: ID!, input: UpdatePosOrderInput! @spread): PosOrder! @update @guard
}

type User {
    id: ID!
    name: String!
    email: String!
    company_id: ID
    company: Company @belongsTo
    is_active: Boolean!
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
}

type AuthPayload {
    access_token: String!
    token_type: String!
    user: User!
}

type LogoutResponse {
    message: String!
}

